backend:
  name: git-gateway
  branch: main
  publish_mode: editorial_workflow

media_folder: "images"
public_folder: "images"

collections:
  # 1. GESTION DE LA CARTE DU RESTAURANT
  - name: "carte"
    label: "🍲 La Carte du Déjeuner"
    folder: "content/carte"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nom du plat", name: "title", widget: "string"}
      - {label: "Prix (€)", name: "price", widget: "number", value_type: "float"}
      - {label: "Catégorie", name: "categorie", widget: "select", options: ["Entrée", "Plat", "Dessert", "Petit-Déjeuner / Goûter"]}
      - {label: "Description du plat", name: "body", widget: "markdown"}

  # 2. GESTION DU SHOP / MON ÉPICERIE FINE (Les 10 Produits)
  - name: "epicerie"
    label: "🛒 Mon Épicerie Fine"
    folder: "content/epicerie"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nom du produit", name: "title", widget: "string"}
      - {label: "Image du produit", name: "image_produit", widget: "image"}
      - {label: "Prix de vente (€)", name: "price", widget: "number", value_type: "float"}
      - {label: "Description courte", name: "body", widget: "string"}

  # 3. GESTION DE LA PAGE ÉVÉNEMENTS & NOËL
  - name: "evenements"
    label: "🎄 Événements & Menus de Noël"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/evenement.md"
        label: "Configuration de la page Événements"
        name: "configuration_evenement"
        fields:
          - {label: "Titre de la page", name: "title", widget: "string"}
          - {label: "Texte d'introduction de Noël", name: "intro_text", widget: "markdown"}
          - {label: "Menu Gourmet (35€)", name: "menu_1", widget: "markdown"}
          - {label: "Menu Prestige (48€)", name: "menu_2", widget: "markdown"}
          - {label: "Menu BAM d'Or (65€)", name: "menu_3", widget: "markdown"}
          - {label: "Entrées, Plats, Desserts À la Carte", name: "a_la_carte", widget: "markdown"}

  # 4. INFOS PRATIQUES, HORAIRES & ALERTE VERTE
  - name: "infos"
    label: "ℹ️ Horaires & Infos Contact"
    delete: false
    editor:
      preview: false
    files:
      - file: "content/infos/horaires.md"
        label: "Horaires et Contact"
        name: "horaires"
        fields:
          - {label: "Téléphone du restaurant", name: "telephone", widget: "string"}
          - {label: "Adresse physique", name: "adresse", widget: "string"}
          - {label: "Horaires du Midi", name: "midi", widget: "string"}
          - {label: "Horaires du Soir", name: "soir", widget: "string"}
          - {label: "Bandeau d'alerte vert (Texte défilant)", name: "alerte", widget: "string"}
