backend:
  name: git-gateway
  branch: main # Vérifiez sur GitHub si votre branche s'appelle main ou master

media_folder: "images" # Où seront stockées les photos du restaurant
public_folder: "/images"

collections:
  - name: "carte"
    label: "La Carte du Restaurant"
    folder: "content/carte"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Nom du Plat", name: "title", widget: "string"}
      - {label: "Prix (en €)", name: "price", widget: "number", value_type: "float"}
      - {label: "Description ou Ingrédients", name: "body", widget: "markdown"}
      - {label: "Catégorie", name: "categorie", widget: "select", options: ["Entrée", "Plat", "Dessert", "Vente à emporter"]}
  - name: "infos"
    label: "Informations pratiques"
    files:
      - file: "content/infos/horaires.md"
        label: "Horaires & Infos"
        name: "horaires"
        fields:
          - {label: "Téléphone du Restaurant", name: "telephone", widget: "string"}
          - {label: "Adresse complète", name: "adresse", widget: "string"}
          - {label: "Horaires du Midi", name: "midi", widget: "string"}
          - {label: "Horaires du Soir", name: "soir", widget: "string"}
          - {label: "Message d'alerte (ex: Fermeture exceptionnelle)", name: "alerte", widget: "text", required: false}
